name: CI

# DO-01: run the test suite on every push and pull request.
# A red test suite exits non-zero, which fails the job and blocks the PR/merge.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      # SEC-18 / RK10 (docs/06-threat-model.md §6.5): third-party actions are pinned
      # to a full 40-char commit SHA, never a mutable tag — a moved tag could
      # silently run new code in this workflow. The release version stays as a
      # trailing comment for humans; `make check`/scripts/security-greps.mjs is
      # not applicable to YAML, so keep these pins current by hand on upgrade.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Node's built-in test runner needs no install step; the site itself has
      # no build step and no runtime dependencies (docs/05-plan.md §6, ADR-001).
      - name: Run test suite
        run: make test
